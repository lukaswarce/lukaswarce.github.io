name: Sitio Astro

on:
  push:
    branches: [master]
  pull_request:
  # El despliegue es manual hasta aprobar el reemplazo del sitio actual.
  # Para desplegar en cada push a master, quita la condición `if` del job `deploy`.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # Conserva el dominio propio si el repositorio tiene CNAME.
      - run: if [ -f CNAME ]; then cp CNAME dist/CNAME; fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
